<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Hors ligne — Kicos Express</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F18401">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "DM Sans", system-ui, sans-serif;
      background: #faf7f3;
      color: #1c1917;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { color: #78716c; margin: 0 0 20px; }
    button {
      background: #F18401;
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div>
    <h1>Vous êtes hors ligne</h1>
    <p>Kicos Express se reconnectera dès que le réseau sera disponible.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
