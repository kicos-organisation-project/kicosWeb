<div class="profile-page">
  <header class="profile-hero">
    <img src="assets/logo/logo.png" alt="Kicos Express" class="profile-logo">
    <div class="profile-hero-text">
      <h1>Mon profil</h1>
      <p>{{ profilLivreur?.firstName }} {{ profilLivreur?.lastName }}</p>
    </div>
  </header>

  <div class="profile-grid">
    <section class="profile-card">
      <h2>Photo de profil</h2>
      <div class="profile-avatar-wrap">
        <img [src]="avatarUrl()" (error)="$any($event.target).src = DEFAULT_AVATAR" class="profile-avatar" alt="Photo profil">
      </div>
      <input type="file" accept="image/*" (change)="onFileSelected($event)">
      <p class="upload-info">JPG, PNG, JPEG — max 5 Mo</p>
      <button type="button" class="btn" (click)="uploadImage()">Enregistrer la photo</button>
    </section>

    <section class="profile-card">
      <h2>Informations personnelles</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">Prénom</label>
          <input type="text" id="firstName" [value]="profilLivreur?.firstName">
        </div>
        <div class="form-group">
          <label for="lastName">Nom</label>
          <input type="text" id="lastName" [value]="profilLivreur?.lastName">
        </div>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [value]="profilLivreur?.email">
      </div>
      <div class="form-group">
        <label for="phoneNumber">Téléphone</label>
        <input type="tel" id="phoneNumber" [value]="profilLivreur?.phoneNumber" disabled>
      </div>
      <button type="button" class="btn-link" data-bs-toggle="modal" data-bs-target="#profil">Modifier mon mot de passe</button>
      <button class="btn" (click)="modifierProfilLivreur()">Enregistrer</button>
    </section>

    <section class="profile-card">
      <h2>Informations livreur</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="latitude">Latitude</label>
          <input type="text" id="latitude" [value]="latitude" readonly>
        </div>
        <div class="form-group">
          <label for="longitude">Longitude</label>
          <input type="text" id="longitude" [value]="longitude" readonly>
        </div>
      </div>
      <button type="button" class="btn mb-2" (click)="getCurrentLocation()">Utiliser ma position</button>
      <div class="form-row">
        <div class="form-group">
          <label>Statut</label>
          <span class="status-badge">{{ profilLivreur?.livreur?.etat }}</span>
        </div>
        <div class="form-group">
          <label for="availability">Disponibilité</label>
          <select id="availability">
            <option value="1" [selected]="profilLivreur?.livreur?.estDisponible === 1">Disponible</option>
            <option value="0" [selected]="profilLivreur?.livreur?.estDisponible === 0">Non disponible</option>
          </select>
        </div>
      </div>
      <button class="btn" (click)="modifierLivreur()">Enregistrer</button>
    </section>
  </div>
</div>

<div class="modal fade" id="profil" tabindex="-1" aria-labelledby="profilLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="profilLabel">Modifier mon mot de passe</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="current_password">Mot de passe actuel</label>
          <input [type]="showPassword ? 'text' : 'password'" id="current_password">
        </div>
        <div class="form-group">
          <label for="new_password">Nouveau mot de passe</label>
          <input [type]="showPassword ? 'text' : 'password'" id="new_password">
        </div>
        <div class="form-group">
          <label for="new_password_confirmation">Confirmer le mot de passe</label>
          <input [type]="showPassword ? 'text' : 'password'" id="new_password_confirmation">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" (click)="modifierPassword()">Valider</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
      </div>
    </div>
  </div>
</div>
