<div class="auth-shell d-flex justify-content-center align-items-center">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="assets/logo/logo.png" alt="Kicos Express" class="auth-logo">
      <div>
        <h1 class="auth-title">Connexion</h1>
        <p class="auth-subtitle">Accédez à votre espace Kicos Express.</p>
      </div>
    </div>

    <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmitLoginForm()">
      <div class="form-group mb-3">
        <label for="email">Email <span class="req">*</span></label>
        <input id="email" type="email" class="input-field" formControlName="email">
        <div class="text-danger small" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Email obligatoire et valide.
        </div>
      </div>

      <div class="form-group mb-4 inputP">
        <label for="password">Mot de passe <span class="req">*</span></label>
        <input [type]="showPassword ? 'text' : 'password'" class="input-field" id="password" formControlName="password">
        <button type="button" (click)="togglePassword()" class="iconEye" aria-label="Afficher le mot de passe">
          <i [ngClass]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
        </button>
        <div class="text-danger small" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Mot de passe obligatoire.
        </div>
      </div>

      <button type="submit" class="btn btn-primary-auth w-100 mb-3" [disabled]="loading || loginForm.invalid">
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>

      <p routerLink="/forgetPassword" class="forgotPassword text-center">Mot de passe oublié ?</p>
    </form>
  </div>
</div>
