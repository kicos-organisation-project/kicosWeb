<div class="page-panel">
  <h5 class="page-panel-title mb-3">Mon solde</h5>

  <div class="solde-info-card mb-4">
    <p class="mb-2">
      Les paiements sont <strong>automatiques</strong>. Votre établissement est crédité après chaque commande livrée.
      Aucune demande manuelle n'est nécessaire.
    </p>
  </div>

  <div class="solde-card" *ngIf="!isLoading; else loading">
    <span class="solde-label">Solde disponible</span>
    <span class="solde-amount">{{ solde?.amount ?? 0 | number:'1.0-0' }} FCFA</span>
  </div>

  <ng-template #loading>
    <p class="text-muted">Chargement du solde...</p>
  </ng-template>
</div>
